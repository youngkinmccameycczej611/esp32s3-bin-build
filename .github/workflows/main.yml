name: ESP32-S3 Build BIN

on:
  push:
    branches:
      - main   # 或你用的默认分支
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. 安装 Arduino CLI 并设置 PATH
      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          export PATH="$HOME/workspace/bin:$PATH"
          arduino-cli version

      # 3. Arduino CLI 配置
      - name: Arduino CLI config
        run: |
          export PATH="$HOME/workspace/bin:$PATH"
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      # 4. 安装 ESP32 Core
      - name: Install ESP32 core
        run: |
          export PATH="$HOME/workspace/bin:$PATH"
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.6

      # 5. 安装库
      - name: Install libraries
        run: |
          export PATH="$HOME/workspace/bin:$PATH"
          arduino-cli lib install "WiFi"
          arduino-cli lib install "HTTPClient"
          arduino-cli lib install "HTTPUpdate"

      # 6. 编译 Devon.ino
      - name: Compile Devon.ino → BIN
        run: |
          export PATH="$HOME/workspace/bin:$PATH"
          mkdir -p build
          arduino-cli compile --fqbn esp32:esp32:esp32s3 ./Devon.ino --output-dir ./build

      # 7. 创建 Release 并上传 BIN
      - name: Create Release and upload BIN
        uses: softprops/action-gh-release@v1
        with:
          files: build/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
